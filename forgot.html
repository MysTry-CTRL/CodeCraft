<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Forgot Password - CodeCraft Academy</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
		<div class="container">
			<a class="navbar-brand fw-bold" href="index.html">
				<span class="brand-mark">&lt;/&gt;</span> CodeCraft
			</a>
			<div class="ms-auto">
				<span class="text-secondary small">New Here? <a href="signup.html" class="link-brand">Sign up now</a></span>
			</div>
		</div>
	</nav>

	<main class="auth-wrapper">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-6 col-lg-5">
					<div class="auth-card">
						<div class="text-center mb-4">
							<span class="eyebrow">Account Recovery</span>
							<h1 class="h2 fw-bold mt-2 mb-1">Forgot your password?</h1>
							<p class="text-secondary small mb-0">Enter your email and we will send instructions to reset your password.</p>
						</div>

						<form action="#" method="post">
							<div class="mb-4">
								<label for="resetEmail" class="form-label">Email Address</label>
								<input type="email" class="form-control" id="resetEmail" name="email" placeholder="youremail@email.com" autocomplete="email" required>
							</div>
							<button type="submit" class="btn btn-brand w-100 py-2">Send Reset Instructions</button>
						</form>

						<p class="text-center auth-switch mt-4 mb-0 small">
							Remember your password? <a href="login.html">Log in</a>
						</p>
					</div>
				</div>
			</div>
		</div>
	</main>

	<footer class="footer py-4">
		<div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
			<span>&copy; 2026 CodeCraft Academy</span>
			<div class="d-flex gap-3">
				<a href="t&c.html" class="text-secondary">Terms</a>
				<a href="privacy.html" class="text-secondary">Privacy</a>
				<a href="index.html" class="text-secondary">Home</a>
				<a href="login.html" class="text-secondary">Log in</a>
				<a href="signup.html" class="text-secondary">Sign up</a>
			</div>
		</div>
	</footer>
</body>
</html>
