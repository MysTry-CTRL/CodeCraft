<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraft Academy - Learn to code, one project at a time</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">  
</head>
<body>
    <!-- Navbar -->
     <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <span class="brand-mark">&lt;/&gt;</span> CodeCraft
            </a>
            <div class="ms-auto">
                <span class="text-secondary small">New Here? <a href="signup.html" class="link-brand">Sign up now</a></span>
            </div>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="auth-card">
                        <div class="text-center mb-4">
                            <span class="eyebrow">Welcome Back</span>
                            <h2 class="fw-bold mt-2 mb-1">Log in to CodeCraft</h2>
                            <p class="text-secondary small mb-0">Pick up right where you left</p>
                        </div>
                        
                        <form novalidate>
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="loginEmail" placeholder="youremail@email.com" required>
                            </div>
                            <div class="mb-2">
                                <label for="loginPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label" small text-secondary for="rememberMe">Remeber Me</label>
                                </div>
                                <a href="forgot.html" class="small link-brand">Forgot Password</a>
                            </div>
                            <button type="submit" class="btn btn-brand w-100 py-2">Log in</button>
                        </form>
                        <div class="text-center my-4 text-secondary small"> or continue with</div>
                        <div class="d-flex gap-3">
                            <button type="button" class="btn btn-outline-dark w-100 py-2"><i class="fa-brands fa-google"></i>  Google</button>
                            <button type="button" class="btn btn-outline-dark w-100 py-2"><i class="fa-brands fa-github"></i>  GitHub</button>
                        </div>
                        <p class="text-center auth-switch mt-4 mb-0 small">
                            Don't have an account? <a href="signup.html">Sign up free</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
        <!-- Footer -->
        <footer class="footer py-4">
                <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
                        <span>&copy; 2026 CodeCraft Academy</span>
                        <div class="d-flex gap-3">
                                <a href="t&c.html" class="text-secondary">Terms</a>
                                <a href="privacy.html" class="text-secondary">Privacy</a>
                                <a href="index.html" class="text-secondary">Home</a>
                                <a href="login.html" class="text-secondary">Log in</a>
                                <a href="signup.html" class="text-secondary">Sign up</a>
                        </div>
                </div>
        </footer>
       
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
